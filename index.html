<!--
╔═════════════════════ 사용 가이드 ═════════════════════╗
 1) 아래 구분선에 있는 부분만 고치면 돼요
 2) 이미지: 폴더에 사진을 넣고 파일명을 적어요.  예) img:"uiso.png"
    (인터넷 주소 https://... 도 가능)
 3) 비워 두면 그 칸은 비어 있거나 숨겨져요. 항목 이름(나이, 생일…)은 그대로 두고 값만 채워요.
 4) 항목을 늘리려면 info 의 rows에 ["항목","값"], 한 줄을 더 추가해요. 상단 틀 그룹도 같은 방식이에요.
 5) 본문 문법 (body 안에 작성):
      == 큰제목 ==        === 소제목 ===      (목차는 자동으로 만들어져요)
      '''굵게'''  ''기울임''  ~~취소선~~
      [[링크]]            [* 각주 내용]       * 목록        > 인용 상자       ---  구분선
      [[이미지:사진.png]]
 6) 색: color(테마색), navColor(캐릭터 이름표·제목줄 색) 값을 바꿔요. (기본 #4bc9c4, #f09091)
 7) 링크: [[문세평]] → 같은 폴더의 "문세평.html" 로 이동 / [[문서이름|보일글자]] 로 직접 지정
    (https://... 주소, 파일명.html, #위치 모두 가능. 확장자는 CONFIG 의 linkExt 로 변경)
 8) 상단 틀 캐릭터: ["이름","사진.png"]  (이동할 문서를 따로 정하려면 ["이름","사진.png","문서.html"])
 9) 공략순서 표: route 의 steps 에 단계를 적으면 단계 수만큼 칸이 자동으로 생겨요.
╚═══════════════════════════════════════════════════════╝
-->

<script>
/* ═════════════ 여기 수정하기 ═════════════ */
const CONFIG = {
  color: "#4bc9c4",            // 테마 색 (정보 상자·상단 틀)
  navColor: "#f09091",         // 캐릭터 이름표·그룹 제목줄 색
  linkExt: ".html",            // [[문서이름]] 링크가 향하는 파일 확장자 (예: [[문세평]] → 문세평.html)
  navCols: 4,                  // 상단 틀에서 한 줄에 보일 캐릭터 수 (기본이에요)
  navOpen: false,              // true 면 상단 틀이 처음부터 펼쳐진 상태
  title: "천의소",                   // 문서 제목 (캐릭터 이름을 써요)
  date: "2026-12-31 00:12:31",                    // 최근 수정 시각 (예: 2026-12-31 00:12:31)
  cats: ["온더훅"],                    // 분류 (예: ["온더훅","캐릭터"])

  logo: "",                    // 로고 이미지 경로 (비우면 기본 물고기 로고) — 상단 틀·정보 상자·공략표에 같이 쓰여요
  showLogo: true,              // false 면 로고를 모두 숨겨요
  logoText: "ON THE HOOK",     // 로고 아래 작은 글자

  // 상단 틀: [그룹이름, [캐릭터들]]  (펼치기·접기 가능)
  // 캐릭터 한 명: ["이름","사진.png"]  예) ["이사리","isari.png"], ["도위","doi.png"]
  navGroups: [
    ["공략 캐릭터", ["이사리", "sari.jpeg"], ["도위", "doui.png"], ["선우스레"], ["선우서래"], ["배추민"], ["최신"], ["사이단"], ["박춘남"], [","], ["장희빈"], ["국민수"], ["리안 퀴니코스"], ["문세평"], ["국민지"], ["반반희"]],
    ["비공략 캐릭터", ["버린물고기"], ["오뚝이"], ["송도끼"], ["연서복"], ["핑패아가씨"], ["인생봇"], ["이재진"], ["온더택배"]]
  ],

  // 정보 상자
  info: {
    name: "천의소",                  // 캐릭터 이름
    img: "uiso.png",                   // 대표 이미지(일러스트, 프로필 사진 등) 경로 (예: "uiso.png")
    moreLabel: "공식프로필 더보기", // 여닫기 되는 곳(프로필 사진용)!! (비우면 숨김)
    moreImg: "",               // 위 사진에 일러스트를 넣었다면 프로필 사진을 여기에!
    rows: [                    // ["항목","값"]  값에는 [[링크]], [* 각주] 사용 가능
      ["나이", "23세"],
      ["생일", "[[12월 31일]]"],
      ["키", "166cm"],
      ["혈액형", "A형"],
      ["성별", "여성"],
      ["학력", "XX고등학교(자퇴)"]
    ]
  },

  quote: "천의소의 공략이 완료되었습니다.",                   // 회색 인용 상자 (비우면 숨김)

  // 공략순서 표: 본문에 [[공략표]] 라고 쓴 자리에 나타나요. 단계 수만큼 칸이 자동으로 생겨요.
  route: {
    name: "천의소",
    steps: ["이상한 애", "뭔데 자꾸 연락해", "다 보이는데", "...", "내 친구"]
  },

  // 본문: 정보 상자 아래에서 시작해요. 문법은 맨 위 가이드를 보세요.
  body: `== 개요 ==
  [[온더훅]]의 공략 캐릭터.
  
  [[문세평]] 공략 완료 후에 '''심리테스트'''와 '''행운의편지'''를 추가하면 추가된다. 

== 특징 ==
어머니가 운영하시는 카페에서 일을 하고 있다.

집안일을 꽤나 잘하는 편인 듯 하다.

=== 작중 행적 ===
처음 말을 걸었을 때, 연락하지 말라며 방을 나가버리지만 다시 말을 걸면 문제 없이 대화가 가능하다.

== 인물관계 ==

== 공략순서 ==
[[공략표]] 
`
};
/* ═════════════ 여기까지! ═════════════ */

const C=CONFIG,$=id=>document.getElementById(id),esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const F=[];
const href=t=>{t=t.trim();return /^(https?:|mailto:|#|\.{0,2}\/)/.test(t)||/\.[A-Za-z0-9]{2,5}$/.test(t)?t:t+(C.linkExt??".html")};
function inl(s){return esc(s).replace(/\[\*\s*([^\]]+)\]/g,(m,t)=>{F.push(t);const n=F.length;return `<sup><a id="r${n}" href="#f${n}" title="${t.replace(/"/g,"&quot;")}">[${n}]</a></sup>`})
.replace(/\[\[이미지:([^\]]+)\]\]/g,'<img class="bi" src="$1" alt="">')
.replace(/'''(.+?)'''/g,"<b>$1</b>").replace(/''(.+?)''/g,"<i>$1</i>").replace(/~~(.+?)~~/g,"<s>$1</s>")
.replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,(m,a,b)=>`<a href="${href(a)}">${b}</a>`).replace(/\[\[([^\]]+)\]\]/g,(m,a)=>`<a href="${href(a)}">${a}</a>`)}
document.documentElement.style.setProperty("--ac",C.color);document.documentElement.style.setProperty("--nt",C.navColor);
document.title=C.title||"위키 문서";
const FISH='<svg viewBox="0 0 100 50"><path d="M5 25C25 0 60 0 80 25C60 50 25 50 5 25ZM80 25L98 8V42Z" fill="#fff"/><circle cx="26" cy="22" r="3" fill="var(--ac)"/></svg>';
const logo=s=>C.showLogo===false?"":`<div class="lg ${s}">${C.logo?`<img src="${C.logo}" alt="">`:FISH}</div>`;
const cap=C.logoText&&C.showLogo!==false?`<div class="cap">${esc(C.logoText)}</div>`:"";
const cols=C.navCols||4;
const cell=x=>{x=Array.isArray(x)?x:[x];const l=x[2]===undefined?x[0]:x[2];return `<div>${x[1]?`<img src="${x[1]}" alt="">`:'<div class="pn"></div>'}<a class="nm"${l?` href="${href(l)}"`:""}>${esc(x[0])}</a></div>`};
const nav=`<div class="nav" style="--cols:${cols}">${logo("")}${cap}${C.navGroups.map(g=>{const a=g[1].map(cell);while(a.length%cols)a.push("<div></div>");return `<div class="nt">${esc(g[0])}</div><a class="nf" data-t>[ 펼치기 · 접기 ]</a><div class="nl"${C.navOpen?"":" hidden"}>${a.length?`<div class="gr">${a.join("")}</div>`:""}</div>`}).join("")}</div>`;
const I=C.info;
const ib=`<div class="ib"><div class="ibh">${logo("s")}${cap}<b>${esc(I.name)||"&nbsp;"}</b></div>${I.img?`<img class="mi" src="${I.img}" alt="">`:'<div class="ph">info.img 에 사진 경로를 적어 주세요</div>'}${I.moreLabel?`<a class="mt" data-t>[ ${esc(I.moreLabel)} ]</a><div hidden>${I.moreImg?`<img class="mi" src="${I.moreImg}" alt="">`:""}</div>`:""}<table>${I.rows.map(r=>`<tr><th>${esc(r[0])}</th><td>${inl(r[1]||"")}</td></tr>`).join("")}</table></div>`;
const R=C.route||{};
const routeHtml=`<div class="rt"><div class="rh">${R.name?`<b>${inl(R.name)}</b>`:""}${logo("s")}${cap}</div><div class="rs">${(R.steps||[]).map(x=>`<div class="rc">${inl(x)}</div>`).join("")}</div></div>`;
let h="",st=[],c=[0,0,0],ls=0,fi=-1,toc="";
const cl=()=>{if(ls){h+="</ul>";ls=0}},ct=d=>{while(st.length&&st[st.length-1]>=d){h+="</div></div>";st.pop()}};
C.body.split("\n").forEach(l=>{
const m=l.match(/^(={2,4})\s*(.+?)\s*\1\s*$/);
if(m){cl();const d=m[1].length-2;if(fi<0)fi=h.length;ct(d);c[d]++;for(let i=d+1;i<3;i++)c[i]=0;const n=c.slice(0,d+1).join(".")+".";
h+=`<div class="sec"><h${d+2} class="hd" id="s${n}"><i class="ch"></i><span class="n">${n}</span><span>${inl(m[2])}</span><span class="ed">[편집]</span></h${d+2}><div class="sc">`;st.push(d);toc+=`<div class="l${d}"><a href="#s${n}">${n}</a> ${esc(m[2])}</div>`;return}
if(l.trim()==="[[공략표]]"){cl();h+=routeHtml;return}
if(/^>\s?/.test(l)){cl();h+=`<blockquote>${inl(l.replace(/^>\s?/,""))}</blockquote>`;return}
if(/^\*\s+/.test(l)){if(!ls){h+="<ul>";ls=1}h+=`<li>${inl(l.replace(/^\*\s+/,""))}</li>`;return}
cl();if(/^-{3,}$/.test(l.trim())){h+="<hr>";return}
