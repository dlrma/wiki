<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>위키 문서</title>
<!--
╔═════════════════════ 사용 가이드 ═════════════════════╗
 1) 아래 구분선에 있는 부분만 고치면 됩니다.
 2) 이미지: 이 파일과 같은 폴더에 사진을 넣고 파일명을 적으세요.  예) img:"uiso.png"
    (인터넷 주소 https://... 도 가능)
 3) 비워 두면 그 칸은 비어 있거나 숨겨집니다. 항목 이름(나이, 생일…)은 그대로 두고 값만 채우세요.
 4) 항목을 늘리려면 rows(100번 줄 블록)에 ["항목","값"], 한 줄 더 추가. 상단 틀 그룹도 같은 방식입니다.
 5) 본문 문법 body(113번 줄 블록)에 작성하기:
      == 큰제목 ==        === 소제목 ===      (목차는 자동으로 만들어져요)
      '''굵게'''  ''기울임''  ~~취소선~~
      [[링크]]            [* 각주 내용]       * 목록        > 인용 상자       ---  구분선
      [[이미지:사진.png]]  본문에 사진 넣기
 6) 색은 color 값을 바꾸세요. 예) "#4bc9c4"(기본 민트)
╚═══════════════════════════════════════════════════════╝
-->
<style>
:root{--ac:#4bc9c4;--nt:#f09091;--tx:#222;--mu:#777;--bd:#d9d9d9;--lk:#4a72d6;--box:#f7f7f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:20px}*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#fff;color:var(--tx);font:15px/1.75 -apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
main{max-width:1000px;margin:0 auto;padding:12px 14px 40px}
a{color:var(--lk);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
h1{margin:10px 0 2px;font-size:30px;font-weight:800}.ph1{color:#bbb}
.meta{font-size:13px;color:var(--mu)}
.bar{display:flex;gap:10px;align-items:center;margin:14px 0}
.grp{display:flex;border:1px solid var(--bd);border-radius:7px;overflow:hidden}
.grp span{display:flex;align-items:center;gap:7px;padding:8px 15px;font-size:15px;border-left:1px solid var(--bd);cursor:default;user-select:none}
.grp span:first-child{border-left:0}.grp svg{width:19px;height:19px;fill:currentColor}
.cats{border:1px solid var(--bd);border-radius:4px;padding:7px 10px;font-size:14px;margin:6px 0 14px}
.nav,.ibh,.mt{background:var(--ac);color:#fff;text-align:center}
.nav{padding:12px;margin-bottom:12px}.nav a{color:#fff}
.lg img{width:90px;display:block;margin:6px auto}.lg.s img{width:56px}
.cap{font-size:11px;letter-spacing:.5px}
.nt{background:var(--nt);font-weight:700;padding:3px;margin-top:10px}
.nf{display:block;font-size:13px;padding:4px;cursor:pointer;color:#fff}.nl{padding:6px 4px;font-size:14px}
.head{display:flex;flex-direction:column;gap:6px}
.ib{border:2px solid var(--ac);background:#fff}
.ibh{padding:16px 8px 12px}.ibh b{display:block;font-size:19px;margin-top:10px}
.mi{width:100%;display:block}
.ph{background:var(--box);color:#aaa;font-size:13px;text-align:center;padding:90px 10px}
.mt{display:block;color:#222;font-weight:700;padding:9px;cursor:pointer;border-top:1px solid #fff}
.ib table{width:100%;border-collapse:collapse;font-size:15px}
.ib th,.ib td{border:1px solid var(--ac);padding:10px 8px;text-align:center;height:42px}
.ib th{background:var(--ac);color:#fff;width:42%;border-color:#fff}
blockquote{margin:12px 0;padding:12px 14px;background:var(--box);border-left:4px solid var(--bd);border-radius:4px}
.toc{display:inline-block;min-width:min(260px,100%);border:1px solid #ccc;background:#fff;padding:12px 18px;margin:14px 0;font-size:15px}.tt b{font-size:19px;font-weight:500}.tb{margin-top:8px}
.tt{display:flex;justify-content:space-between;align-items:center;cursor:pointer}.toc.fold .tb{display:none}
.l1{margin-left:16px}.l2{margin-left:32px}
.ch{display:inline-block;width:9px;height:9px;border-right:2px solid #777;border-bottom:2px solid #777;transform:translateY(-3px) rotate(45deg);margin:0 8px 0 3px;flex:none}
.sec.fold>.hd .ch,.toc.fold .ch{transform:translateX(-2px) rotate(-45deg)}.sec.fold>.hd{color:#888}.sec.fold>.hd .n,.sec.fold>.hd .ed{opacity:.5}.sec.fold>.sc{display:none}
.hd{display:flex;align-items:center;gap:7px;cursor:pointer;margin:24px 0 8px;border-bottom:1px solid var(--bd);padding-bottom:5px;font-weight:700}
h2.hd{font-size:22px}h3.hd{font-size:18px}h4.hd{font-size:16px}
.n{color:var(--lk)}.ed{margin-left:auto;font-size:12px;font-weight:700;color:var(--lk)}
p{margin:8px 0}ul{padding-left:24px;margin:8px 0}hr{border:0;border-top:1px solid var(--bd)}
.bi{max-width:100%;border-radius:4px;display:block;margin:10px 0}sup a{font-size:12px}
.fn{border-top:1px solid var(--bd);margin-top:28px;padding-top:10px;font-size:13px;color:var(--mu)}.fn a{margin-right:6px}
@media(min-width:720px){.head{flex-direction:row-reverse;gap:20px;align-items:flex-start}.side{width:340px;flex:none}.mainc{flex:1;min-width:0}}
</style>
</head>
<body>
<main>
<h1 id="o-t"></h1>
<div class="meta" id="o-m"></div>
<div class="bar">
<div class="grp"><span><svg viewBox="0 0 24 24"><path d="M22 9.24l-7.19-.62L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.63-7.03L22 9.24zM12 15.4l-3.76 2.27 1-4.28-3.32-2.88 4.38-.38L12 6.1l1.71 4.04 4.38.38-3.32 2.88 1 4.28L12 15.4z"/></svg></span><span><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>편집</span><span><svg viewBox="0 0 24 24"><path d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z"/></svg>토론</span><span><svg viewBox="0 0 24 24"><path d="M18 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM9 4h2v5l-1-.8L9 9V4z"/></svg>역사</span></div>
<div class="grp"><span style="padding:8px 13px"><svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg></span></div>
</div>
<div class="cats" id="o-c"></div>
<div id="o-d"></div>
</main>
<script>
/* ═════════════ 여기 수정하기 ═════════════ */
const CONFIG = {
  color: "#4bc9c4",            // 테마 색 (정보 상자·상단 틀)
  navColor: "#f09091",         // 상단 틀 그룹 제목줄(공략 캐릭터 등) 배경색
  title: "천의소",                   // 문서 제목
  date: "2026-12-31 00:12:31",                    // 최근 수정 시각 (예: 2026-12-31 00:12:31)
  cats: ["온더훅"],                    // 분류 (예: ["온더훅","캐릭터"])

  logo: "",                    // 로고 이미지 경로 (예: "logo.png") — 상단 틀·정보 상자에 같이 쓰여요
  logoText: "",                // 로고 아래 작은 글자

  // 상단 틀: [그룹이름, [항목들]]  (펼치기·접기 가능)
  navGroups: [
    ["공략 캐릭터", []],
    ["비공략 캐릭터", []]
  ],

  // 정보 상자
  info: {
    name: "천의소",                  // 캐릭터 이름
    img: "uiso.png",                   // 대표 이미지(일러스트, 프로필 사진 등) 경로 (예: "uiso.png")
    moreLabel: "공식프로필 더보기", // 여닫기 되는 곳(프로필 사진용)!! (비우면 숨김)
    moreImg: "",               // 위 사진에 일러스트를 넣었다면 프로필 사진을 여기에!
    rows: [                    // ["항목","값"]  값에는 [[링크]], [* 각주] 사용 가능
      ["나이", "23세"],
      ["생일", "12월 31일"],
      ["키", "166cm"],
      ["혈액형", "A형"],
      ["성별", "여성"],
      ["학력", "XX고등학교(자퇴)"]
    ]
  },

  quote: "천의소의 공략이 완료되었습니다.",                   // 회색 인용 상자 (비우면 숨김)

  // 본문: 정보 상자 아래에서 시작해요. 문법은 맨 위 가이드를 보세요.
  body: `== 개요 ==
  [[온더훅]]의 공략 캐릭터.
  
  [[문세평]] 공략 완료 후에 '''심리테스트'''와 '''행운의편지'''를 추가하면 추가된다. 

== 특징 ==

=== 작중 행적 ===

== 인물관계 ==

== 공략순서 ==
`
};
/* ═════════════ 여기까지! ═════════════ */

const C=CONFIG,$=id=>document.getElementById(id),esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const F=[];
function inl(s){return esc(s).replace(/\[\*\s*([^\]]+)\]/g,(m,t)=>{F.push(t);const n=F.length;return `<sup><a id="r${n}" href="#f${n}" title="${t.replace(/"/g,"&quot;")}">[${n}]</a></sup>`})
.replace(/\[\[이미지:([^\]]+)\]\]/g,'<img class="bi" src="$1" alt="">')
.replace(/'''(.+?)'''/g,"<b>$1</b>").replace(/''(.+?)''/g,"<i>$1</i>").replace(/~~(.+?)~~/g,"<s>$1</s>")
.replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,"<a>$2</a>").replace(/\[\[([^\]]+)\]\]/g,"<a>$1</a>")}
document.documentElement.style.setProperty("--ac",C.color);document.documentElement.style.setProperty("--nt",C.navColor);
document.title=C.title||"위키 문서";
const logo=s=>C.logo?`<div class="lg ${s}"><img src="${C.logo}" alt=""></div>`:"";
const cap=C.logoText?`<div class="cap">${esc(C.logoText)}</div>`:"";
const nav=`<div class="nav">${logo("")}${cap}${C.navGroups.map(g=>`<div class="nt">${esc(g[0])}</div><a class="nf" data-t>[ 펼치기 · 접기 ]</a><div class="nl" hidden>${g[1].map(x=>`<a>${esc(x)}</a>`).join(" · ")}</div>`).join("")}</div>`;
const I=C.info;
const ib=`<div class="ib"><div class="ibh">${logo("s")}${C.logoText&&!C.logo?"":""}<b>${esc(I.name)||"&nbsp;"}</b></div>${I.img?`<img class="mi" src="${I.img}" alt="">`:'<div class="ph">info.img 에 사진 경로를 적어 주세요</div>'}${I.moreLabel?`<a class="mt" data-t>[ ${esc(I.moreLabel)} ]</a><div hidden>${I.moreImg?`<img class="mi" src="${I.moreImg}" alt="">`:""}</div>`:""}<table>${I.rows.map(r=>`<tr><th>${esc(r[0])}</th><td>${inl(r[1]||"")}</td></tr>`).join("")}</table></div>`;
let h="",st=[],c=[0,0,0],ls=0,fi=-1,toc="";
const cl=()=>{if(ls){h+="</ul>";ls=0}},ct=d=>{while(st.length&&st[st.length-1]>=d){h+="</div></div>";st.pop()}};
C.body.split("\n").forEach(l=>{
const m=l.match(/^(={2,4})\s*(.+?)\s*\1\s*$/);
if(m){cl();const d=m[1].length-2;if(fi<0)fi=h.length;ct(d);c[d]++;for(let i=d+1;i<3;i++)c[i]=0;const n=c.slice(0,d+1).join(".")+".";
h+=`<div class="sec"><h${d+2} class="hd" id="s${n}"><i class="ch"></i><span class="n">${n}</span><span>${inl(m[2])}</span><span class="ed">[편집]</span></h${d+2}><div class="sc">`;st.push(d);toc+=`<div class="l${d}"><a href="#s${n}">${n}</a> ${esc(m[2])}</div>`;return}
if(/^>\s?/.test(l)){cl();h+=`<blockquote>${inl(l.replace(/^>\s?/,""))}</blockquote>`;return}
if(/^\*\s+/.test(l)){if(!ls){h+="<ul>";ls=1}h+=`<li>${inl(l.replace(/^\*\s+/,""))}</li>`;return}
cl();if(/^-{3,}$/.test(l.trim())){h+="<hr>";return}
if(l.trim())h+=`<p>${inl(l)}</p>`});cl();ct(0);
const intro=fi<0?h:h.slice(0,fi),rest=fi<0?"":h.slice(fi);
const fn=F.length?'<div class="fn">'+F.map((t,i)=>`<div id="f${i+1}"><a href="#r${i+1}">[${i+1}]</a>${esc(t)}</div>`).join("")+"</div>":"";
$("o-t").innerHTML=C.title?esc(C.title):'<span class="ph1">문서 제목</span>';
$("o-m").textContent="최근 수정 시각: "+C.date;
$("o-c").innerHTML="분류: "+C.cats.map(x=>`<a>${esc(x)}</a>`).join(" ");
$("o-d").innerHTML=nav+`<div class="head"><div class="side">${ib}</div><div class="mainc">${C.quote?`<blockquote>${inl(C.quote)}</blockquote>`:""}${intro}${toc?`<div class="toc"><div class="tt"><b>목차</b><i class="ch"></i></div><div class="tb">${toc}</div></div>`:""}</div></div>`+rest+fn;
document.addEventListener("click",e=>{const t=e.target;let x;
if(x=t.closest("[data-t]"))x.nextElementSibling.hidden=!x.nextElementSibling.hidden;
else if(x=t.closest(".hd"))x.parentElement.classList.toggle("fold");
else if(x=t.closest(".tt"))x.parentElement.classList.toggle("fold")});
</script>
</body>
</html>
