╔═════════════════════ 사용 가이드 ═════════════════════╗
 1) 아래 구분선에 있는 부분만 고치면 돼요
 2) 이미지: image 폴더에 사진을 넣고 파일명만 적어요.  예) "uiso.png"
    (인터넷 주소 https://... 도 가능)
 3) 비워 두면 그 칸은 비어 있거나 숨겨져요. 항목 이름(나이, 생일…)은 그대로 두고 값만 채워요.
 4) 항목을 늘리려면 info 의 rows에 ["항목","값"], 한 줄을 더 추가해요. 상단 틀 그룹도 같은 방식이에요.
 5) 본문 문법 (body 안에 작성):
      == 큰제목 ==        === 소제목 ===      (목차는 자동으로 만들어져요)
      '''굵게'''  ''기울임''  ~~취소선~~
      [[링크]]            [* 각주 내용]       * 목록        > 인용 상자       ---  구분선
      [[이미지:사진.png]]
 6) 색: color(테마색), navColor(캐릭터 이름표·제목줄 색) 값을 바꿔요. (기본 #4bc9c4, #f09091)
 7) 링크: [[온더훅]] → 외부 "온더훅" 문서로 이동 / [[링크|보일글자]] 로 직접 지정 예) [[https://namu.wiki/w/%EC%98%A8%EB%8D%94%ED%9B%85|온더훅]]
 8) 상단 틀 캐릭터: ["이름","사진.png"]  (이동할 문서를 따로 정하려면 ["이름","사진.png","문서.html"])
 9) 공략순서 표: route 의 steps 에 단계를 적으면 단계 수만큼 칸이 자동으로 생겨요.
10) 작은 글씨: {{{-1 작게}}}  {{{-2 더 작게}}}  {{{+1 크게}}}  (정보 상자의 (괄호) 안은 자동으로 작아져요)
12) 각주 이름 붙이기: [*이름 내용] → 번호 대신 [이름] 로 표시돼요. (*바로 뒤에 이름을 붙이고, 한 칸 띄우고 내용)
                     같은 각주를 다시 쓰려면 [*이름] 처럼 이름만 쓰면 돼요.
╚═══════════════════════════════════════════════════════╝
-->

  // 공략순서 표: 본문에 [[공략표]] 라고 쓴 자리에 나타나요. 단계 수만큼 칸이 자동으로 생겨요.

  // 본문: 정보 상자 아래에서 시작해요. 문법은 맨 위 가이드를 보세요.
  body: `== 개요 ==
  [[https://namu.wiki/w/%EC%98%A8%EB%8D%94%ED%9B%85|온더훅]]의 공략 캐릭터.
  
  [[https://namu.wiki/w/%EB%AC%B8%EC%84%B8%ED%8F%89|문세평]] 공략 완료 후에 '''심리테스트'''와 '''행운의편지'''를 추가하면 추가된다. 

== 특징 ==
어머니가 운영하시는 카페에서 일을 하고 있다.

집안일을 꽤나 잘하는 편인 듯 하다.

== 인물관계 ==

== 공략순서 ==
[[공략표]] 
`

const C=CONFIG,$=id=>document.getElementById(id),esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const F=[];
const href=t=>{t=t.trim();return /^(https?:|mailto:|#|\.{0,2}\/)/.test(t)||/\.[A-Za-z0-9]{2,5}$/.test(t)?t:t+(C.linkExt??".html")};
const P=p=>{p=(p||"").trim();return !p||/^(https?:|data:|\.{0,2}\/)/.test(p)||p.includes("/")?p:(C.imgDir??"")+p};
function fmt(s){return s
.replace(/\{\{\{([+-][1-5])\s+([^}]*)\}\}\}/g,(m,z,t)=>`<span style="font-size:${Math.max(.5,1+z*.2)}em">${t}</span>`)
.replace(/\[\[이미지:([^\]]+)\]\]/g,(m,p)=>`<img class="bi" src="${P(p)}" alt="">`)
.replace(/'''(.+?)'''/g,"<b>$1</b>").replace(/''(.+?)''/g,"<i>$1</i>").replace(/~~(.+?)~~/g,"<s>$1</s>")
.replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,(m,a,b)=>`<a href="${href(a)}">${b}</a>`).replace(/\[\[([^\]]+)\]\]/g,(m,a)=>`<a href="${href(a)}">${a}</a>`)}
const FL=[],FN={};let UN=0;
function inl(s){return fmt(esc(s).replace(/\[\*([^\s\[\]]*)\s*((?:\[\[[^\]]*\]\]|[^\[\]])*)\]/g,(m,nm,t)=>{
if(nm&&!t.trim()&&FN[nm])return `<sup><a class="fr" data-n="${FN[nm]}">[${nm}]</a></sup>`;
if(!t.trim()){t=nm;nm=""}
F.push(fmt(t));const n=F.length,lb=nm||++UN;FL.push(lb);if(nm)FN[nm]=n;
return `<sup><a class="fr" id="r${n}" data-n="${n}">[${lb}]</a></sup>`}))}
document.documentElement.style.setProperty("--ac",C.color);document.documentElement.style.setProperty("--nt",C.navColor);
document.title=C.title||"위키 문서";
const FISH='<svg viewBox="0 0 100 50"><path d="M5 25C25 0 60 0 80 25C60 50 25 50 5 25ZM80 25L98 8V42Z" fill="#fff"/><circle cx="26" cy="22" r="3" fill="var(--ac)"/></svg>';
const logo=s=>C.showLogo===false?"":`<div class="lg ${s}">${C.logo?`<img src="${P(C.logo)}" alt="">`:FISH}</div>`;
const cap=C.logoText&&C.showLogo!==false?`<div class="cap">${esc(C.logoText)}</div>`:"";
const cols=C.navCols||4;
const cell=x=>{x=Array.isArray(x)?x:[x];const l=x[2]===undefined?x[0]:x[2];return `<div>${x[1]?`<img src="${P(x[1])}" alt="">`:'<div class="pn"></div>'}<a class="nm"${l?` href="${href(l)}"`:""}>${esc(x[0])}</a></div>`};
const nav=`<div class="nav" style="--cols:${cols}">${logo("")}${cap}${C.navGroups.map(g=>{const a=(g.length>2?g.slice(1):g[1]||[]).map(cell);while(a.length%cols)a.push("<div></div>");return `<div class="nt">${esc(g[0])}</div><a class="nf" data-t>[ 펼치기 · 접기 ]</a><div class="nl"${C.navOpen?"":" hidden"}>${a.length?`<div class="gr">${a.join("")}</div>`:""}</div>`}).join("")}</div>`;
const I=C.info;
const sp=v=>C.smallParen===false?v:v.replace(/\[\*(?:\[\[[^\]]*\]\]|[^\[\]])*\]|\([^()]*\)/g,m=>m[0]==="["?m:` {{{-1 ${m}}}}`);
const ib=`<div class="ib"><div class="ibh">${logo("s")}${cap}<b>${esc(I.name)||"&nbsp;"}</b></div>${I.img?`<img class="mi" src="${P(I.img)}" alt="">`:'<div class="ph">info.img 에 사진 경로를 적어 주세요</div>'}${I.moreLabel?`<a class="mt" data-t>[ ${esc(I.moreLabel)} ]</a><div hidden>${I.moreImg?`<img class="mi" src="${P(I.moreImg)}" alt="">`:""}</div>`:""}<table>${I.rows.map(r=>`<tr><th>${esc(r[0])}</th><td>${inl(sp(r[1]||""))}</td></tr>`).join("")}</table></div>`;
const R=C.route||{};
const routeHtml=`<div class="rt"><div class="rh">${R.name?`<b>${inl(R.name)}</b>`:""}${logo("s")}${cap}</div><div class="rs">${(R.steps||[]).map(x=>`<div class="rc">${inl(x)}</div>`).join("")}</div></div>`;
let h="",st=[],c=[0,0,0],ls=0,fi=-1,toc="";
const cl=()=>{if(ls){h+="</ul>";ls=0}},ct=d=>{while(st.length&&st[st.length-1]>=d){h+="</div></div>";st.pop()}};
C.body.split("\n").forEach(l=>{
const m=l.match(/^(={2,4})\s*(.+?)\s*\1\s*$/);
if(m){cl();const d=m[1].length-2;if(fi<0)fi=h.length;ct(d);c[d]++;for(let i=d+1;i<3;i++)c[i]=0;const n=c.slice(0,d+1).join(".")+".";
h+=`<div class="sec"><h${d+2} class="hd" id="s${n}"><i class="ch"></i><span class="n">${n}</span><span>${inl(m[2])}</span><span class="ed">[편집]</span></h${d+2}><div class="sc">`;st.push(d);toc+=`<div class="l${d}"><a href="#s${n}">${n}</a> ${esc(m[2])}</div>`;return}
if(l.trim()==="[[공략표]]"){cl();h+=routeHtml;return}
if(/^>\s?/.test(l)){cl();h+=`<blockquote>${inl(l.replace(/^>\s?/,""))}</blockquote>`;return}
if(/^\*\s+/.test(l)){if(!ls){h+="<ul>";ls=1}h+=`<li>${inl(l.replace(/^\*\s+/,""))}</li>`;return}
cl();if(/^-{3,}$/.test(l.trim())){h+="<hr>";return}
if(l.trim())h+=`<p>${inl(l)}</p>`});cl();ct(0);
const intro=fi<0?h:h.slice(0,fi),rest=fi<0?"":h.slice(fi);
const fn=F.length?'<div class="fn">'+F.map((t,i)=>`<div id="f${i+1}"><a href="#r${i+1}">[${FL[i]}]</a>${t}</div>`).join("")+"</div>":"";
$("o-t").innerHTML=C.title?esc(C.title):'<span class="ph1">문서 제목</span>';
$("o-m").textContent="최근 수정 시각: "+C.date;
$("o-c").innerHTML="분류: "+C.cats.map(x=>`<a href="${href(esc(x))}">${esc(x)}</a>`).join(" ");
$("o-d").innerHTML=nav+`<div class="head"><div class="side">${ib}</div><div class="mainc">${C.quote?`<blockquote>${inl(C.quote)}</blockquote>`:""}${intro}${toc?`<div class="toc"><div class="tt"><b>목차</b><i class="ch"></i></div><div class="tb">${toc}</div></div>`:""}</div></div>`+rest+fn;
document.addEventListener("click",e=>{const t=e.target;let x;
if(x=t.closest(".fr")){e.preventDefault();const n=+x.dataset.n;$("pt").innerHTML=`<a class="pn" data-go="f${n}">[${FL[n-1]}]</a>${F[n-1]}`;$("pop").hidden=false}
else if(x=t.closest("[data-go]")){$("pop").hidden=true;$(x.dataset.go).scrollIntoView({block:"center"})}
else if(t.id==="pop"||t.closest("#pc"))$("pop").hidden=true;
else if(x=t.closest("[data-t]"))x.nextElementSibling.hidden=!x.nextElementSibling.hidden;
else if(x=t.closest(".hd"))x.parentElement.classList.toggle("fold");
else if(x=t.closest(".tt"))x.parentElement.classList.toggle("fold")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("pop").hidden=true});
</script>
</body>
</html>
